name: Deploy Briefly to Cloudflare Workers

on:
  push:
    branches: [main, master, claude/ai-agent-scraper-bPzib]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create or retrieve KV namespace via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Try to create the KV namespace
          CREATE_RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"title": "briefly-A2A_TASKS"}')

          echo "Create response: $CREATE_RESPONSE"

          KV_ID=$(echo "$CREATE_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if data.get('success'):
              print(data['result']['id'])
          " 2>/dev/null || echo "")

          # If creation failed (e.g. already exists), list namespaces to find it
          if [ -z "$KV_ID" ]; then
            echo "Namespace may already exist — listing to find ID..."
            LIST_RESPONSE=$(curl -s \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

            echo "List response (truncated): $(echo $LIST_RESPONSE | head -c 500)"

            KV_ID=$(echo "$LIST_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for ns in data.get('result', []):
              if ns.get('title') in ('briefly-A2A_TASKS', 'A2A_TASKS'):
                  print(ns['id'])
                  break
          " 2>/dev/null || echo "")
          fi

          if [ -z "$KV_ID" ]; then
            echo "ERROR: Could not create or find KV namespace."
            exit 1
          fi

          echo "✅ KV Namespace ID: $KV_ID"
          # Inject real ID into wrangler.toml (before vite build so it's included in generated config)
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/${KV_ID}/" wrangler.toml
          echo "✅ Updated wrangler.toml with KV ID"
          grep "id = " wrangler.toml

      - name: Build client assets
        run: npx vite build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/briefly/wrangler.json

      - name: Deployment summary
        run: |
          echo ""
          echo "✅ Briefly deployed successfully!"
          echo "🌐  App:         https://briefly.workers.dev"
          echo "💬  Chat API:    https://briefly.workers.dev/agents/briefly/global"
          echo "📡  MCP server:  https://briefly.workers.dev/mcp"
          echo "🤖  A2A card:    https://briefly.workers.dev/.well-known/agent-card.json"
          echo "📊  Feed API:    https://briefly.workers.dev/api/feed"
